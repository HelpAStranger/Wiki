<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mekaminers Wiki - Início</title>
    <link rel="icon" href="assets/imgs/menu/webicon.jpg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex flex-col relative items-center justify-center">

    <div class="absolute inset-0 bg-grid -z-10 h-screen w-full"></div>

    <main class="w-full max-w-5xl fade-in text-center p-4">
        <h1 class="text-4xl md:text-6xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400 mb-4 pb-2">
            Base de Conhecimento
        </h1>
        <p class="text-slate-400 text-lg mb-8 max-w-2xl mx-auto">
            Selecione o universo que deseja explorar para acessar comandos, tutoriais e informações do servidor.
        </p>

        <!-- Botões Sociais e Site -->
        <div class="flex flex-col sm:flex-row items-center justify-center gap-4 mb-12">
            <a href="https://discord.mekaminers.net" target="_blank" class="w-full sm:w-auto inline-flex items-center justify-center bg-[#5865F2] hover:bg-[#4752C4] text-white font-bold py-3 px-8 rounded-full transition transform hover:scale-105 shadow-lg shadow-indigo-500/20">
                <i class="fab fa-discord mr-2"></i> Discord
            </a>
            <a href="https://mekaminers.net" target="_blank" class="w-full sm:w-auto inline-flex items-center justify-center bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 px-8 rounded-full transition transform hover:scale-105 shadow-lg border border-slate-600">
                <i class="fas fa-globe mr-2"></i> Site Oficial
            </a>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 w-full px-4">
            
            <!-- Minecraft Modded Link -->
            <a href="minecraftmodded.html" class="block card-hover group bg-slate-800/50 hover:bg-slate-800 border border-slate-700 rounded-2xl p-8 flex flex-col items-center justify-center min-h-[300px] relative overflow-hidden decoration-0">
                <div class="absolute inset-0 bg-gradient-to-br from-green-900/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
                <div class="h-24 w-24 bg-slate-700 rounded-full flex items-center justify-center mb-6 shadow-lg group-hover:scale-110 transition-transform duration-300">
                    <i class="fas fa-cube text-4xl text-emerald-400"></i>
                </div>
                <h2 class="text-2xl font-bold text-white mb-2">Minecraft Modded</h2>
                <span class="mt-6 px-3 py-1 bg-green-500/20 text-green-400 text-xs font-bold uppercase tracking-wider rounded-full border border-green-500/30">
                    Disponível
                </span>
            </a>

            <!-- Hytale Link -->
            <a href="hytale.html" class="block card-hover group bg-slate-800/50 hover:bg-slate-800 border border-slate-700 rounded-2xl p-8 flex flex-col items-center justify-center min-h-[300px] relative overflow-hidden decoration-0">
                <div class="absolute inset-0 bg-gradient-to-br from-blue-900/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
                <div class="h-24 w-24 bg-slate-700 rounded-full flex items-center justify-center mb-6 shadow-lg group-hover:scale-110 transition-transform duration-300">
                    <i class="fas fa-gamepad text-4xl text-blue-400"></i>
                </div>
                <h2 class="text-2xl font-bold text-white mb-2">Hytale</h2>
                <span class="mt-6 px-3 py-1 bg-yellow-500/20 text-yellow-400 text-xs font-bold uppercase tracking-wider rounded-full border border-yellow-500/30">
                    Desenvolvimento
                </span>
            </a>

        </div>
    </main>

    <footer class="w-full bg-slate-900 border-t border-slate-800 py-6 mt-auto absolute bottom-0">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <p class="text-slate-500 text-sm">© Mekaminers. Todos os direitos reservados.</p>
        </div>
    </footer>

</body>
</html>
